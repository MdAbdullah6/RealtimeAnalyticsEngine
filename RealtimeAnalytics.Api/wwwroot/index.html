<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Realtime Analytics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: Segoe UI, Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            margin: 0;
            padding: 24px;
        }

        h1 {
            margin: 0 0 4px;
            color: #1e3a8a;
        }

        .sub {
            color: #64748b;
            margin-bottom: 24px;
        }

        .cards {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            min-width: 220px;
            flex: 1;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
            border-top: 4px solid #3b82f6;
        }

        .label {
            color: #64748b;
            font-size: 14px;
        }

        .value {
            font-size: 36px;
            font-weight: 700;
            margin-top: 6px;
            color: #1e293b;
        }

        .panel {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
        }

        input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            width: 140px;
            font-size: 16px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

            button:hover {
                background: #2563eb;
            }

        #status {
            font-size: 14px;
            margin-left: 12px;
            font-weight: 600;
        }

        .on {
            color: #16a34a;
        }

        .off {
            color: #dc2626;
        }
    </style>
</head>
<body>
    <h1>Realtime Analytics Dashboard</h1>
    <div class="sub">
        Open this page in two browser windows. Add an event in one and watch both update instantly.
        <span id="status" class="off">Connecting...</span>
    </div>

    <div class="cards">
        <div class="card"><div class="label">Total Events</div><div class="value" id="events">0</div></div>
        <div class="card"><div class="label">Total Revenue</div><div class="value" id="revenue">0</div></div>
        <div class="card"><div class="label">Last Updated</div><div class="value" id="updated" style="font-size:18px">-</div></div>
    </div>

    <div class="panel">
        <input id="amount" type="number" step="0.01" value="25" />
        <button onclick="addEvent()">Add Event</button>
    </div>

    <div class="panel"><canvas id="chart" height="90"></canvas></div>

    <script>
    const chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: { labels: [], datasets: [{ label: "Total Revenue", data: [], borderColor: "#3b82f6", tension: 0.3 }] },
      options: { animation: false }
    });

    function show(s) {
      document.getElementById("events").textContent = s.totalEvents;
      document.getElementById("revenue").textContent = Number(s.totalRevenue).toFixed(2);
      document.getElementById("updated").textContent = new Date().toLocaleTimeString();
      chart.data.labels.push(new Date().toLocaleTimeString());
      chart.data.datasets[0].data.push(s.totalRevenue);
      if (chart.data.labels.length > 15) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
      chart.update();
    }

    async function addEvent() {
      const amount = parseFloat(document.getElementById("amount").value);
      await fetch("/api/Analytics/events", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount })
      });
    }

    const connection = new signalR.HubConnectionBuilder()
      .withUrl("/hubs/analytics").withAutomaticReconnect().build();

    connection.on("ReceiveAnalytics", show);

    connection.start().then(async () => {
      const status = document.getElementById("status");
      status.textContent = "Live"; status.className = "on";
      const res = await fetch("/api/Analytics");
      show(await res.json());
    }).catch(() => { document.getElementById("status").textContent = "Disconnected"; });
    </script>
</body>
</html>
